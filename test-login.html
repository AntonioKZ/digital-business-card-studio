<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collaudo accessi · Business Card Studio</title><style>body{font:16px system-ui;background:#edf3fa;color:#173052;margin:0;padding:24px}main{max-width:540px;margin:50px auto;background:white;padding:30px;border-radius:20px;box-shadow:0 10px 35px #142c4819}label{display:block;margin:16px 0 6px;font-weight:600}input,select,button{width:100%;box-sizing:border-box;padding:13px;border:1px solid #bdcad9;border-radius:10px;font:inherit}button{margin-top:22px;background:#14569d;color:white;cursor:pointer;border:0}p{line-height:1.6}.muted{color:#65748a}#status{min-height:25px}</style></head><body><main><h1>Accesso di collaudo</h1><p class="muted">Ambiente Preview. Tre identità separate per verificare ruoli e autorizzazioni. Non usare dati personali reali.</p><label for="profile">Profilo</label><select id="profile"><option value="collaudosuperadmin@invalid.example">Super amministratore</option><option value="collaudoadminmi@invalid.example">Amministratore Meridionale Impianti</option><option value="collaudodipendente@invalid.example">Dipendente Meridionale Impianti</option></select><label for="password">Password di test</label><input type="password" id="password" autocomplete="off"><button id="login">Entra nel prototipo</button><p id="status" role="status"></p><p><a href="/admin.html">Torna all'accesso principale</a></p></main><script>document.getElementById('login').onclick=async()=>{const status=document.getElementById('status');status.textContent='Verifica credenziali…';try{const r=await fetch('/api/test-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('profile').value,password:document.getElementById('password').value})});const data=await r.json();if(!r.ok)throw Error(data.error||'HTTP '+r.status);sessionStorage.setItem('studio-jwt',data.token);location.replace('/admin.html')}catch(e){status.textContent=e.message}}</script></body></html>
