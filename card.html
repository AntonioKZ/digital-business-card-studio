<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business Card</title><style>body{font:16px system-ui;background:#edf3f9;color:#183250;margin:0;padding:24px}.card{max-width:480px;margin:40px auto;background:white;border-radius:22px;overflow:hidden;box-shadow:0 12px 45px #1233}.hero{background:linear-gradient(120deg,var(--primary,#102b53),var(--accent,#147ea4));color:white;padding:30px}h1{font-size:26px;margin:0 0 8px}h2{font-size:16px;font-weight:500;margin:0;opacity:.9}.details{padding:25px;display:grid;gap:14px}.details a{color:#1559a1;overflow-wrap:anywhere}small{display:block;color:#64748b;margin:10px 0}.error{max-width:480px;margin:60px auto}</style></head><body><main class="card" id="card" hidden><div class="hero" id="hero"><small id="company" style="color:#e6edf5"></small><h1 id="name"></h1><h2 id="role"></h2></div><div class="details" id="details"></div></main><p id="error" class="error">Caricamento card…</p><script>const params=new URLSearchParams(location.search);const org=params.get('organization'),slug=params.get('slug');const valid=s=>s&&/^[a-z0-9-]{2,90}$/.test(s);const $=id=>document.getElementById(id);async function main(){if(!valid(org)||!valid(slug))throw Error('Indirizzo card non valido');const r=await fetch('/api/public-card?organization='+encodeURIComponent(org)+'&slug='+encodeURIComponent(slug));if(!r.ok)throw Error('Card non disponibile o non ancora approvata');const {card}=await r.json();const d=card.data||{};$('company').textContent=card.organization_name||'';$('name').textContent=d.name||'';$('role').textContent=d.role||'';const branding=card.branding||{};for(const [key,css] of [['primary','--primary'],['accent','--accent']]){if(/^#[0-9a-f]{6}$/i.test(branding[key]||''))$('hero').style.setProperty(css,branding[key])}for(const [label,value,prefix] of [['Telefono',d.phone,'tel:'],['Email',d.email,'mailto:'],['Sito web',d.website,''],['WhatsApp',d.whatsapp,'https://wa.me/'],['Sede',d.address,''],['Social',d.social,'']]){if(typeof value!=='string'||!value.trim())continue;const row=document.createElement('div');const title=document.createElement('strong');title.textContent=label+': ';row.append(title);if(prefix||label==='Sito web'||label==='Social'){const a=document.createElement('a');let href=prefix+value;if(label==='Sito web'||label==='Social')href=value;if(label==='Sito web'||label==='Social'){try{if(new URL(href).protocol!=='https:')continue}catch{continue}}a.href=href;a.rel='noopener noreferrer';a.textContent=value;row.append(a)}else{const t=document.createElement('span');t.textContent=value;row.append(t)}$('details').append(row)}document.title=(d.name||'Business Card')+' · '+card.organization_name;$('error').hidden=true;$('card').hidden=false}main().catch(e=>{$('error').textContent=e.message});</script></body></html>
