<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biglietto digitale</title><style>*{box-sizing:border-box}body{margin:0;background:#edf3fc;font:15px system-ui;color:#19355e}main{max-width:510px;margin:12px auto;padding:0 12px}@media(max-width:600px){main{max-width:none;width:100%;margin:0;padding:0}body{background:#fff}#tools{padding:12px 8px}}iframe{display:block;width:100%;border:0;background:transparent;min-height:640px}@media(max-width:600px){iframe{width:100vw;min-height:0}}#status{text-align:center;padding:16px}#tools{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:12px}button{border:0;border-radius:10px;background:#1957ad;color:white;padding:12px 16px;font:inherit;cursor:pointer}@media(min-width:700px){main{margin:28px auto}}</style></head><body><main><p id="status">Caricamento del biglietto approvato…</p><iframe id="card" title="Biglietto da visita digitale" hidden></iframe><div id="tools" hidden><button id="share">Condividi</button><button id="copy">Copia link</button></div></main><script>
const params=new URLSearchParams(location.search),org=params.get('organization'),slug=params.get('slug'),frame=document.getElementById('card'),status=document.getElementById('status');
function valid(s){return typeof s==='string'&&/^[a-z0-9-]{2,90}$/.test(s)}
function setText(doc,selector,value){const el=doc.querySelector(selector);if(el)el.textContent=value||''}
function apply(doc,d,url){
setText(doc,'.identity h1',d.name);setText(doc,'.identity p',d.role);
const brand=doc.querySelector('.brand');if(brand)for(const el of brand.querySelectorAll('*'))if(!el.children.length&&/Meridionale Impianti/i.test(el.textContent))el.textContent=d.company||'';
for(const el of doc.querySelectorAll('.detail')){const label=el.querySelector('strong')?.textContent.toLowerCase()||'',span=el.querySelector('span');if(!span)continue;if(label.includes('email'))span.textContent=d.email||'';else if(label.includes('cell')||label.includes('mobile'))span.textContent=d.phone||'';else if(label.includes('sede')||label.includes('address'))span.textContent=d.address||''}
for(const a of doc.querySelectorAll('a[href]')){const href=a.getAttribute('href')||'';if(href.startsWith('mailto:'))a.href='mailto:'+(d.email||'');else if(href.startsWith('tel:'))a.href='tel:'+(d.phone||'').replace(/[^+0-9]/g,'');else if(href.includes('wa.me/'))a.href='https://wa.me/'+(d.whatsapp||(d.phone||'').replace(/[^0-9]/g,''));else if(href.includes('linkedin.com')){if(d.social&&/^https:\/\//.test(d.social))a.href=d.social;else{a.removeAttribute('href');a.style.pointerEvents='none'}const small=a.querySelector('small');if(small)small.textContent=d.social||''}else if(href.includes('merimp.com')&&d.website){a.href=d.website;const small=a.querySelector('small');if(small)small.textContent=d.website.replace(/^https?:\/\//,'')}else if(href.endsWith('.vcf')){const v=['BEGIN:VCARD','VERSION:3.0','FN:'+(d.name||''),'ORG:'+(d.company||''),'TITLE:'+(d.role||''),'TEL;TYPE=CELL:'+(d.phone||''),'EMAIL:'+(d.email||''),'URL:'+url,'END:VCARD'].join('\r\n');a.href='data:text/vcard;charset=utf-8,'+encodeURIComponent(v);a.download=((d.name||'contatto').replace(/[^a-z0-9-]/gi,'-'))+'.vcf'}}
const logo=doc.querySelector('img.logo');if(logo&&d.logoData&&d.logoData.startsWith('data:image/'))logo.src=d.logoData;
const qr=doc.querySelector('.qrpanel img');if(qr){qr.src='https://api.qrserver.com/v1/create-qr-code/?size=250x250&data='+encodeURIComponent(url);qr.alt='QR del biglietto di '+(d.name||'')}
const css=doc.createElement('style');css.textContent='html,body{height:auto!important;min-height:0!important;overflow:visible!important;display:block!important;padding:0!important;margin:0!important;background:#fff!important}.card{margin:0 auto!important;transform:none!important;width:100%!important;max-width:none!important;border-radius:0!important;box-shadow:none!important}.hero{background:linear-gradient(120deg,'+(/^#[0-9a-f]{6}$/i.test(d.primary||'')?d.primary:'#091a39')+','+(/^#[0-9a-f]{6}$/i.test(d.accent||'')?d.accent:'#133f80')+')!important}';doc.head.append(css);
for(const script of [...doc.querySelectorAll('script')])script.remove();doc.title=(d.name||'Biglietto')+' · '+(d.company||'');return '<!doctype html>'+doc.documentElement.outerHTML}
async function start(){if(!valid(org)||!valid(slug))throw Error('Indirizzo non valido');const [api,template]=await Promise.all([fetch('/api/public-card?organization='+encodeURIComponent(org)+'&slug='+encodeURIComponent(slug)),fetch('/template.html')]);if(!api.ok)throw Error('Biglietto non pubblicato o non disponibile');if(!template.ok)throw Error('Template non disponibile');const {card}=await api.json(),d=card.data||{};d.company=d.company||card.organization_name;const doc=new DOMParser().parseFromString(await template.text(),'text/html');frame.srcdoc=apply(doc,d,location.href);frame.hidden=false;frame.addEventListener('load',()=>{const inner=frame.contentDocument;if(!inner)return;const resize=()=>{frame.style.height=Math.max(1,Math.ceil(inner.documentElement.scrollHeight)+2)+'px'};resize();new ResizeObserver(resize).observe(inner.querySelector('.card')||inner.body)});document.title=(d.name||'Biglietto digitale')+' · '+card.organization_name;status.hidden=true;document.getElementById('tools').hidden=false}
document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(location.href);document.getElementById('copy').textContent='Link copiato'};
document.getElementById('share').onclick=async()=>{if(navigator.share)await navigator.share({title:document.title,url:location.href});else await navigator.clipboard.writeText(location.href)};
start().catch(e=>status.textContent=e.message);
</script></body></html>
